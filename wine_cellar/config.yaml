name: Wine Cellar
version: "1.28.0"
slug: wine_cellar
description: Wine database with stock, search and drinking windows
url: https://github.com/taugusti/ha-wine
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:glass-wine
panel_title: Wine Cellar
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Direct access over HTTPS with login (for users who should only see Wine Cellar)
backup: cold
options:
  ai_task_entity: ""
  search_agent_entity: ""
  allowed_users: []
  certfile: ""
  keyfile: ""
  extra_hostnames: []
schema:
  ai_task_entity: str?
  search_agent_entity: str?
  allowed_users:
    - str
  certfile: str?
  keyfile: str?
  extra_hostnames:
    - str
map:
  - type: media
    read_only: false
  - type: ssl
    read_only: true
