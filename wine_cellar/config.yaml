name: Wine Cellar
version: "1.34.0"
slug: wine_cellar
description: Wine database with stock, search and drinking windows
url: https://github.com/taugusti/ha-wine
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:glass-wine
panel_title: Wine Cellar
homeassistant_api: true
hassio_api: true
auth_api: true
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: Direct access over HTTPS with login (for users who should only see Wine Cellar)
backup: cold
options:
  ai_task_entity: ""
  search_agent_entity: ""
  allowed_users: []
  api_apps: []
  api_apps_write: false
  certfile: ""
  keyfile: ""
  extra_hostnames: []
  currency: ""
  number_locale: ""
  search_area: ""
  search_fallback_area: ""
  shops: []
  offer_max_price: 0
  offer_min_saving: 30
  offer_small_saving: 15
  value_mid: 0
  value_high: 0
  own_barcode_prefix: ""
  ai_language: "en"
  import_wine_sheet: ""
  import_stock_sheet: ""
schema:
  ai_task_entity: str?
  search_agent_entity: str?
  allowed_users:
    - str
  api_apps:
    - str
  api_apps_write: bool?
  certfile: str?
  keyfile: str?
  extra_hostnames:
    - str
  currency: str?
  number_locale: str?
  search_area: str?
  search_fallback_area: str?
  shops:
    - str
  offer_max_price: float?
  offer_min_saving: float?
  offer_small_saving: float?
  value_mid: float?
  value_high: float?
  own_barcode_prefix: match(^\d{0,11}$)?
  ai_language: str?
  import_wine_sheet: str?
  import_stock_sheet: str?
map:
  - type: media
    read_only: false
  - type: ssl
    read_only: true
